name: forward

# Records the frozen-rule forward ledgers every day and commits them, so the
# git history timestamps every recorded bar.
#
# GitHub delays scheduled runs under load and sometimes drops them, worst at
# the top and half of the hour; the first 00:30 UTC run (2026-10-30) had not
# fired 2.5 hours later. So: odd minutes, and two runs a day. Recording is
# idempotent, so the second run only writes what the first missed.
#   01:17 UTC  after QQQ's close (20:00/21:00 UTC) and BTC's 00:00 UTC bar
#   13:43 UTC  backup; QQQ's bar for the day is still forming and is skipped
on:
  schedule:
    - cron: "17 1 * * *"
    - cron: "43 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forward-ledger
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Never record with an engine that fails its own tests.
      - run: pytest
      # Every spec in forward/specs. A ledger whose download fails writes
      # nothing and catches up tomorrow; the others still get recorded.
      - name: Record new bars
        id: record
        continue-on-error: true
        run: python main.py forward run
      # Nothing is committed unless every started ledger reconciles.
      - run: python main.py forward reconcile
      - name: Commit the new rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward/ledgers forward/README.md
          if git diff --cached --quiet; then
            echo "no new completed bar"
            exit 0
          fi
          git commit -m "Forward ledger: run of $(date -u +%F)"
          git push
      - name: Fail the run if any ledger could not record
        if: steps.record.outcome == 'failure'
        run: |
          echo "At least one ledger failed to record (see 'Record new bars'); the rest were committed."
          exit 1
